<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <p class="site-role">Mathematical evolutionary biologist &middot; Konrad Lorenz Institute for Evolution and Cognition Research</p>
        <nav class="site-nav" aria-label="Main">
          {% for item in site.nav %}<a href="{{ item.url | relative_url }}"{% if page.nav == item.key %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
        </nav>
      </div>
    </header>

    <main class="container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>Mauricio González-Forero</span>
        <span>mauricio.gonzalez-forero [at] kli.ac.at</span>
      </div>
    </footer>
  </body>
</html>
